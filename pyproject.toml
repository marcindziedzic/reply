[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-assistant"
version = "0.1.0"
description = "Email assistant for sales and support using Gmail and Claude API"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "anthropic>=0.40.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.111.0",
    "pyyaml>=6.0.1",
    "html2text>=2024.2.26",
    "markdown>=3.5.0",
]

[project.scripts]
email-assistant = "email_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]
